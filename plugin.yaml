name: route6
version: 0.1.6
description: "Route6 (route6.me) — give your agent its own public IPv6 identity, hostname, port forwarding and webhook URLs, web fetch/search/scrape from its own IP, and a private team mesh with coordination tools. All 23 Route6 MCP tools auto-discovered from gw.route6.me, every one on every plan including Free; bundled usage skill (route6:route6)."
author: Route6
kind: standalone
requires_env:
  - name: ROUTE6_API_KEY
    description: "Route6 API key — create a free account (no card) and copy the key from the dashboard"
    url: "https://route6.me"
    secret: true
optional_env:
  - name: ROUTE6_GATEWAY_URL
    description: "Override the Route6 MCP gateway URL (default: https://gw.route6.me/mcp)"
  - name: ROUTE6_TOOL_TIMEOUT
    description: "Per-tool-call timeout in seconds (default: 120)"
provides_tools:
  - hostname_register
  - identity
  - net
  - plan_upgrade
  - port_forward
  - port_forward_secure
  - port_forward_tls
  - scrape
  - smtp_allowlist
  - team_capability
  - team_chat
  - team_events
  - team_loop
  - team_metrics
  - team_ping
  - team_project_task
  - team_roles
  - team_status
  - team_task
  - team_whiteboard
  - web_browse
  - web_fetch
  - web_search
